name: test

on:
  push:
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Ruff
        run: pip install ruff && ruff check crossing tests alembic
      - name: Pytest
        env:
          CROSSING_ALLOW_DEV: "1"
          CROSSING_KEY_PEPPER: "ci-test-pepper"
        run: pytest -q
      - name: Docker build
        run: docker build -t crossing:ci .
      - name: pip-audit
        continue-on-error: true
        run: |
          if pip install pip-audit; then
            pip-audit -r requirements.txt
          else
            echo "pip-audit skipped (install failed)"
          fi

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crossing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CROSSING_ALLOW_DEV: "1"
      CROSSING_KEY_PEPPER: "ci-test-pepper"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/crossing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Alembic upgrade
        run: alembic upgrade head
      - name: Pytest
        run: pytest -q
