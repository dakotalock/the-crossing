# Staging example: Caddy → FastAPI → Postgres + worker.
# cp .env.example .env  (fill locally; never commit secrets)
#
# Postgres is bound to 127.0.0.1 only (not 0.0.0.0). For internet-facing
# deploys, omit the host port and keep Postgres on the compose network.
# POSTGRES_PASSWORD comes from the environment; the default is local-only.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crossing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crossing-dev-local-only}
      POSTGRES_DB: crossing
    volumes:
      - crossing_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossing -d crossing"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    profiles: ["postgres", "staging"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://crossing:${POSTGRES_PASSWORD:-crossing-dev-local-only}@postgres:5432/crossing
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command:
      [
        "uvicorn",
        "crossing.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--timeout-graceful-shutdown",
        "30",
      ]
    profiles: ["staging"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://crossing:${POSTGRES_PASSWORD:-crossing-dev-local-only}@postgres:5432/crossing
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "crossing.worker"]
    profiles: ["staging"]

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "80:80"
    depends_on:
      - api
    profiles: ["caddy", "staging"]

volumes:
  crossing_pg:
